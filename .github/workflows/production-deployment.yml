name: Deploy Production

on:
  push:
    branches:
      - main

env:
  STACK_NAME: torchlife
  SERVICE_NAME: app
  # ENV_CTX: production
  ENV_CTX: torchlife_prod
  ENV_DIR: torchlife-backend
  PORT: 8080

jobs:
  # test:
  #   name: 🔍 Run Tests
  #   runs-on: ubuntu-latest
  # strategy:
  # environment: production
  #   steps:
  #     - uses: actions/checkout@v6
  #     - name: Set up Go
  #       uses: actions/setup-go@v5
  #       with:
  #         go-version: ${{ vars.GO_VERSION }}
  #     - name: Run tests
  #       run: go test ./...

  build:
    name: 🔨 Build Docker Image
    runs-on: ubuntu-latest
    environment: production
    # needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ vars.IMAGE_REGISTRY_PATH }}:${{ env.ENV_CTX }}_${{ env.SHORT_SHA }}

  push:
    name: 🚀 Push to Docker Hub
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Log in to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.IMAGE_REGISTRY_PATH }}:${{ env.ENV_CTX }}_${{ env.SHORT_SHA }}

  deploy:
    name: 🚢 Deploy to Docker Swarm
    runs-on: ubuntu-latest
    environment: production
    needs: push
    steps:
      - uses: actions/checkout@v6
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Backup Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SWARM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker logs $(docker ps -q --filter name=${{ env.SERVICE_NAME }}) > ~/${{ env.ENV_CTX }}/backup_logs/${{ github.run_id }}.log || true

      - name: Login and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SWARM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # cd ${{ env.ENV_CTX }}
            cd ${{ env.ENV_DIR }}
            # docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ vars.DOCKER_USERNAME }} --password-stdin
            export TAG=${{ env.SHORT_SHA }}
            export DOCKER_TAG=${{ env.ENV_CTX }}_${{ env.SHORT_SHA }}

            # set -a
            # source .env
            # set +a

            set -o allexport
            source <(grep -vE '^\s*#|^\s*$' .env)
            set +o allexport

            docker pull ${{ vars.IMAGE_REGISTRY_PATH }}:${{ env.ENV_CTX }}_${{ env.SHORT_SHA }}

            docker stack deploy -c docker-compose.yml ${{ env.STACK_NAME }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SWARM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Deployment verification that checks for failed tasks
            echo "Checking deployment status..."

            # Wait up to 5 minutes for service to be ready
            timeout=300
            elapsed=0

            while [ $elapsed -lt $timeout ]; do
              # Get service replica status
              replicas=$(docker service ls --filter name=${{ env.STACK_NAME }}_${{ env.SERVICE_NAME }} --format "{{.Replicas}}")
              running=$(echo $replicas | cut -d'/' -f1)
              desired=$(echo $replicas | cut -d'/' -f2)
              
              echo "Service status: $running/$desired replicas"
              
              # Get the most recent tasks (regardless of desired state) to check latest deployment attempt
              recent_tasks=$(docker service ps ${{ env.STACK_NAME }}_${{ env.SERVICE_NAME }} --format "{{.Name}} {{.CurrentState}}" --no-trunc | head -n $desired)
              
              echo "Checking most recent tasks:"
              echo "$recent_tasks"
              
              # Check if any of the most recent tasks failed
              recent_failed_count=$(echo "$recent_tasks" | grep -c "Failed" || echo "0")
              
              if [ $recent_failed_count -gt 0 ]; then
                echo "❌ Deployment failed: $recent_failed_count of the most recent task(s) failed"
                echo "Task details:"
                docker service ps ${{ env.STACK_NAME }}_${{ env.SERVICE_NAME }} --no-trunc | head -n 10
                exit 1
              fi
              
              # If service shows correct replicas, check if running containers are recent (not old)
              if [ "$running" = "$desired" ] && [ "$running" != "0" ]; then
                # Check running containers age using docker ps
                running_containers=$(docker ps --filter "name=${{ env.STACK_NAME }}_${{ env.SERVICE_NAME }}" --format "{{.Status}}")
                echo "Running container status:"
                echo "$running_containers"
                
                # Check if any container has been running for more than 10 minutes (likely old deployment)
                old_containers=$(echo "$running_containers" | grep -E "(hour|hours|day|days)" || echo "")
                
                if [ -n "$old_containers" ]; then
                  echo "⚠️  Found old containers still running, waiting for new deployment..."
                else
                  echo "✅ Deployment successful: All containers are recent and running"
                  exit 0
                fi
              fi
              
              echo "⚠️  Waiting for deployment to complete..."
              sleep 10
              elapsed=$((elapsed + 10))
            done

            echo "❌ Deployment verification timeout after $timeout seconds"
            docker service ps ${{ env.STACK_NAME }}_${{ env.SERVICE_NAME }} --no-trunc
            exit 1

      # - name: Run DB Migration (optional)
      #   if: success()
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SWARM_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       docker exec $(docker ps -q --filter name=${{ env.SERVICE_NAME }}) /app/migrate

